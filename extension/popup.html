<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <style>
    body { margin: 0; width: 300px; font: 14px/1.6 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif; color: #fff; background: #0F1733; }
    .box { padding: 18px; }
    h1 { display: flex; align-items: center; gap: 8px; margin: 0 0 4px; font-size: 16px; }
    h1 img { width: 24px; height: 24px; }
    p { margin: 0 0 14px; color: rgba(255, 255, 255, .72); }
    button { display: block; width: 100%; height: 42px; margin-top: 8px; border-radius: 999px; font: inherit; font-weight: 700; cursor: pointer; }
    .primary { background: #FFC93C; color: #0F1733; border: 0; }
    .primary:hover { background: #FFD666; }
    .ghost { background: transparent; color: #fff; border: 1px solid rgba(255, 255, 255, .3); }
    .ghost:hover { border-color: rgba(255, 255, 255, .6); }
    .status { font-size: 13px; margin: 12px 0 0; }
    .links { margin: 12px 0 0; text-align: center; font-size: 13px; }
    .links a { color: #FFC93C; }
    button:focus-visible, a:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="box">
    <h1><img src="icons/48.png" alt="">投準</h1>
    <p>在職缺頁按「評估這個頁面」，對照你的經歷判斷值不值得投。104 的職缺頁右下角也有按鈕。</p>
    <button class="primary" id="evalBtn">評估這個頁面</button>
    <button class="ghost" id="optionsBtn">編輯個人檔案</button>
    <p class="status" id="status"></p>
    <p class="links"><a href="https://github.com/DHoper/jobfit" target="_blank" rel="noopener">使用說明與原始碼</a></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
