<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>投準｜個人檔案</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <span class="brand"><img src="icons/48.png" alt="">投準</span>
      <nav class="tabs" role="tablist">
        <button role="tab" aria-selected="true" data-tab="profile">個人檔案</button>
        <button role="tab" aria-selected="false" data-tab="history">評估紀錄</button>
        <button role="tab" aria-selected="false" data-tab="advanced">進階設定</button>
      </nav>
      <span class="saved" id="saved" aria-live="polite"></span>
    </div>
  </header>

  <main class="wrap">
    <!-- 個人檔案 -->
    <section data-panel="profile">
      <div class="intro">
        <h1>你的個人檔案</h1>
        <p>評估職缺時，AI 只會根據這裡寫的內容判斷，不會替你編造經歷。寫得越具體，評估越準。資料只存在這台電腦的瀏覽器裡，輸入時會自動儲存。</p>
      </div>

      <div class="card">
        <h2>最快的開始方式</h2>
        <label class="field">
          <span>貼上你的舊履歷（純文字就好）</span>
          <textarea data-key="resume" rows="8" placeholder="從 Word、PDF 或 104 履歷複製全部文字貼進來"></textarea>
        </label>
      </div>

      <div class="card">
        <h2>經歷與能力</h2>
        <div class="row">
          <label class="field"><span>目前職稱或身分</span><input data-key="title" placeholder="例如：後端工程師、應屆畢業生"></label>
          <label class="field"><span>總年資</span><input data-key="years" placeholder="例如：5 年"></label>
        </div>
        <label class="field"><span>工作經歷</span><textarea data-key="experience" rows="6" placeholder="公司、職稱、期間、主要負責什麼。每段經歷一段。"></textarea></label>
        <label class="field"><span>技能與工具</span><textarea data-key="skills" rows="3" placeholder="例如：Java、Spring Boot、PostgreSQL、AWS、帶過 3 人小組"></textarea></label>
        <label class="field">
          <span>代表性成果（STAR 案例）</span>
          <small>情境、任務、你做了什麼、結果。有數字更好，例如「把查詢時間從 8 秒降到 0.5 秒」。</small>
          <textarea data-key="stories" rows="6"></textarea>
        </label>
      </div>

      <div class="card">
        <h2>你想要的工作</h2>
        <label class="field"><span>職涯目標</span><textarea data-key="goals" rows="3" placeholder="接下來兩三年想往哪個方向發展"></textarea></label>
        <div class="row">
          <label class="field"><span>期望薪資</span><input data-key="salary" placeholder="例如：月薪 7 萬以上、年薪 100 萬"></label>
          <label class="field"><span>期望地點／遠端</span><input data-key="location" placeholder="例如：台北、可接受混合辦公"></label>
        </div>
        <label class="field"><span>其他偏好</span><textarea data-key="preferences" rows="3" placeholder="公司規模、產業、團隊文化等"></textarea></label>
      </div>

      <div class="card">
        <h2>不能接受的條件</h2>
        <p class="muted">勾選的項目出現在職缺裡時，評估結果會直接建議跳過。</p>
        <div class="checks" id="dealbreakerChecks"></div>
        <label class="field"><span>其他不能接受的條件</span><input data-key="dealbreakers" placeholder="例如：通勤超過 1 小時、要求簽競業條款"></label>
      </div>

      <div class="card actions-card">
        <h2>備份</h2>
        <p class="muted">換電腦或重灌前，先匯出個人檔案存成檔案。</p>
        <div class="actions">
          <button class="btn" id="exportBtn">匯出個人檔案</button>
          <label class="btn file-btn">匯入個人檔案<input type="file" id="importInput" accept="application/json" hidden></label>
        </div>
      </div>
    </section>

    <!-- 評估紀錄 -->
    <section data-panel="history" hidden>
      <div class="intro">
        <h1>評估紀錄</h1>
        <p>評估過的職缺都會留在這裡，點標題回到職缺頁。</p>
      </div>
      <div id="historyList"></div>
    </section>

    <!-- 進階設定 -->
    <section data-panel="advanced" hidden>
      <div class="intro">
        <h1>進階設定</h1>
        <p>一般使用者不用改這裡。</p>
      </div>
      <div class="card">
        <h2>AI 評估服務</h2>
        <label class="field">
          <span>代理伺服器網址</span>
          <small>部署 repo 裡的 worker/ 之後取得，例如 https://jobfit-proxy.你的帳號.workers.dev</small>
          <input data-setting="proxyUrl" placeholder="https://">
        </label>
        <label class="field">
          <span>DeepSeek API 金鑰（開發者自己測試用）</span>
          <small>填了就直接呼叫 DeepSeek，不經過代理。金鑰只存在這台電腦。</small>
          <input data-setting="apiKey" type="password" autocomplete="off" placeholder="sk-...">
        </label>
      </div>
      <div class="card">
        <h2>清除資料</h2>
        <div class="actions"><button class="btn danger" id="clearHistory">清除所有評估紀錄</button></div>
      </div>
    </section>
  </main>

  <script src="rules.js"></script>
  <script src="options.js"></script>
</body>
</html>
