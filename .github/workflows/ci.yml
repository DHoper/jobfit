name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # 端對端測試需要 Chrome for Testing（一般版 Chrome 不允許用命令列載入擴充功能）
      - name: Install Chrome for Testing
        id: chrome
        run: |
          path=$(npx -y @puppeteer/browsers install chrome@stable --path ~/.cache/cft | tail -1 | awk '{print $2}')
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - run: npm run e2e
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist/jobfit-extension.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: .output/e2e/
