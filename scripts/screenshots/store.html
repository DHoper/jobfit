<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;width:1280px;height:800px;display:flex;font-family:'PingFang TC','Noto Sans TC',sans-serif;background:#F4F5F8;color:#0F1733;overflow:hidden}
.left{width:880px;padding:56px 56px 0;display:flex;flex-direction:column}
h1{font-size:40px;line-height:1.25;margin:0 0 12px;font-weight:800;letter-spacing:.02em}
.sub{font-size:18px;color:#4A5470;margin:0 0 36px;line-height:1.6}
.win{flex:1;background:#fff;border-radius:14px 14px 0 0;box-shadow:0 20px 60px -20px rgba(15,23,51,.35);overflow:hidden}
.bar{height:40px;background:#E9ECF2;display:flex;align-items:center;gap:8px;padding:0 16px}
.dot{width:11px;height:11px;border-radius:50%;background:#CBD0DA}
.url{margin-left:14px;flex:1;height:24px;border-radius:6px;background:#fff;font-size:12px;color:#7A8399;display:flex;align-items:center;padding:0 10px}
.page{padding:28px 36px;font-size:15px;line-height:1.9}
.page h2{margin:0;font-size:24px}.co{color:#4A5470;margin:4px 0 18px}
.tag{display:inline-block;background:#F4F5F8;border-radius:6px;padding:2px 10px;margin-right:6px;font-size:13px;color:#4A5470}
.h{background:rgba(229,72,77,.22);text-decoration:underline 2px #CD2B31;text-underline-offset:3px}
.m{background:rgba(255,201,60,.5)}
.right{width:400px;height:800px;border-left:1px solid #E3E6EC;background:#fff}
iframe{border:0;width:400px;height:800px}
</style></head><body>
<div class="left">
  <h1 id="h"></h1><p class="sub" id="s"></p>
  <div class="win"><div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url">jobs.example.tw/job/8x2kq</span></div>
  <div class="page"><h2>資深後端工程師（Go / 金流平台）</h2><p class="co">鼎昇數位支付股份有限公司・台北市內湖區</p>
  <span class="tag">月薪 70,000~95,000 元</span><span class="tag">5 年以上</span><span class="tag">每週可遠端 2 天</span>
  <p style="margin-top:20px">負責金流平台後端 API 設計與開發，處理每日百萬筆交易。<br>本職務為<span class="h">責任制</span>，產品上線前需<span class="h">配合加班</span>。<br><span class="m">抗壓性高</span>、能獨立作業者佳。<br><span class="m">試用期三個月，試用期間薪資 9 折</span>。<br>其他主管交辦事項。</p></div></div>
</div>
<div class="right"><iframe id="f"></iframe></div>
<script>
const q=new URLSearchParams(location.search);
document.getElementById('h').textContent=q.get('h');document.getElementById('s').textContent=q.get('sub');
const f=document.getElementById('f');f.src='sidepanel.html?s='+(q.get('s')||'pre');
if(q.get('scroll'))f.onload=()=>setTimeout(()=>{const d=f.contentDocument;const sec=[...d.querySelectorAll('section')].find(x=>x.textContent.includes(q.get('scroll')));const m=d.getElementById('panel-main');if(sec&&m)m.scrollTop=sec.offsetTop-m.offsetTop-260;},700);
</script></body></html>
